name: agent
description: "多模型 AI 聊天客户端（OpenAI / Anthropic 格式，多渠道轮询，多 Agent 并问）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_miuix: ^1.3.0
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  gal: ^2.3.3
  gpt_markdown: ^1.3.4
  image: ^4.12.0
  image_picker: ^1.2.4
  pasteboard: ^0.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  local_auth: ^3.0.2
  webview_flutter: ^4.14.1
  quick_actions: ^1.1.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/presets/
